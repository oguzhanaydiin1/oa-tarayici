name: oa_tarayici
description: Pusula Browser — OA Labs tasarım sistemiyle Windows ve Android tarayıcı taslağı.
publish_to: 'none'
version: 0.19.0+48

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  mobile_scanner: ^7.4.2
  background_downloader: ^9.6.5
  app_links: ^6.4.0
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.15
  local_auth: ^3.0.0
  window_manager: ^0.5.1
  xml: ^6.5.0
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  timezone: '>=0.9.4 <0.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/readability.js
    - assets/reader.js
    - assets/hls.min.js

