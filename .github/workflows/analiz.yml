name: Analiz
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze (yalnız hatalar)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analiz.txt 2>&1 || true
          grep -E "^\s*error" analiz.txt | head -300 || true
          echo "HATA SAYISI: $(grep -cE '^\s*error' analiz.txt)"
          ! grep -qE '^\s*error' analiz.txt
