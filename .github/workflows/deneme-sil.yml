name: Deneme sürümlerini sil
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName' | grep '^deneme-' | while read t; do
            gh release delete "$t" -R "$REPO" --yes --cleanup-tag && echo "silindi $t"
          done
