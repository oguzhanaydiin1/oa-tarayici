name: Derle

# main'e her gönderimde Windows exe ve Android apk derlenir ve
# pubspec.yaml'daki sürüm numarasıyla (ör. v0.1.0) Releases sayfasına deneme sürümü olarak eklenir.
# Aynı numarayla tekrar derlenirse dosyalar güncellenir; yeni sürüm için pubspec.yaml'da version'ı artır.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    # windows-latest artık Visual Studio 2026 kullanıyor; flutter_inappwebview_windows onunla derlenmiyor (STL1011).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform klasörünü hazırla
        shell: bash
        run: bash scripts/platform_hazirla.sh windows

      - run: flutter pub get

      - name: Kod analizi (bilgi için, derlemeyi durdurmaz)
        continue-on-error: true
        shell: bash
        run: bash scripts/ozetle.sh analiz flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Derle
        shell: bash
        run: bash scripts/ozetle.sh windows flutter build windows --release -v

      - name: Paketle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OA-Tarayici-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OA-Tarayici-Windows
          path: OA-Tarayici-Windows.zip

      - name: Sürüm numarası
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: Sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: OA Tarayıcı ${{ steps.ver.outputs.v }} (deneme)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: OA-Tarayici-Windows.zip

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform klasörünü hazırla
        run: bash scripts/platform_hazirla.sh android

      - run: flutter pub get

      - name: Sürüm bilgisi
        continue-on-error: true
        run: bash scripts/ozetle.sh surumler bash -c "flutter --version; flutter pub outdated"

      - name: Eklenti düzeltmesi
        run: bash scripts/eklenti_duzelt.sh

      - name: Derle
        # Deneme sürümü: Flutter'ın hata ayıklama anahtarıyla imzalanır, Play Store'a yüklenemez.
        run: bash scripts/ozetle.sh android flutter build apk --release

      - name: Yeniden adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk OA-Tarayici-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OA-Tarayici-Android
          path: OA-Tarayici-Android.apk

      - name: Sürüm numarası
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: Sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: OA Tarayıcı ${{ steps.ver.outputs.v }} (deneme)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: OA-Tarayici-Android.apk
